<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khủng long 3D</title>
<style>
:root{--sky:#f1ece2;--card:rgba(40,27,52,0.95);--cardfg:#fff;--edge:#b79ddb;--sub:#d9c9ee;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--sky);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none}
.card{background:var(--card);color:var(--cardfg);border:2px solid var(--edge);border-radius:12px;padding:6px 14px;text-align:center;min-width:92px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#fl{position:fixed;inset:0;background:#e0452e;opacity:0;pointer-events:none}
.card small{display:block;font-size:11px;color:var(--sub);letter-spacing:.04em}
.card b{font-size:26px;font-variant-numeric:tabular-nums;font-weight:700}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8vh)}
#msg .card{padding:16px 24px;max-width:80%}
#msg h1{margin:0 0 6px;font-size:28px}
#msg p{margin:0;font-size:15px;color:var(--sub)}
#soundBtn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:16px;z-index:100;width:52px;height:52px;border-radius:50%;border:2px solid var(--edge);background:var(--card);color:var(--cardfg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 10px rgba(0,0,0,.35);pointer-events:auto;-webkit-tap-highlight-color:transparent}
#soundBtn:hover{transform:scale(1.12);box-shadow:0 4px 16px rgba(0,0,0,.35)}
#soundBtn:active{transform:scale(.95)}
#soundBtn .icon-on{display:inline}
#soundBtn .icon-off{display:none}
#soundBtn.muted .icon-on{display:none}
#soundBtn.muted .icon-off{display:inline}
#soundBtn .slash{position:absolute;width:3px;height:32px;background:#e0452e;border-radius:2px;transform:rotate(45deg);transition:opacity .25s;opacity:0}
#soundBtn.muted .slash{opacity:1}

/* Hiệu ứng chuyển cảnh không gian */
#warpFlash{position:fixed;inset:0;background:radial-gradient(circle at center,#ffffff 0%,#00e5ff 35%,#7928ca 75%,#000000 100%);opacity:0;pointer-events:none;transition:opacity .8s ease-out;z-index:90}
#spaceBanner{position:fixed;top:15%;left:50%;transform:translateX(-50%) scale(0.85);background:rgba(12,8,28,0.92);border:2px solid #00e5ff;border-radius:16px;padding:12px 24px;text-align:center;color:#fff;box-shadow:0 0 30px rgba(0,229,255,0.65),inset 0 0 15px rgba(121,40,202,0.4);opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s cubic-bezier(.175,.885,.32,1.275);z-index:95}
#spaceBanner.show{opacity:1;transform:translateX(-50%) scale(1)}
#spaceBanner .banner-title{font-size:22px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#00e5ff,#ff007f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#spaceBanner .banner-sub{font-size:13px;color:#d9c9ee;margin-top:4px;letter-spacing:.04em}

/* === NÂNG CẤP V2: BANNER SỰ KIỆN, CHIP HIỆU ỨNG, POPUP ĐIỂM, SLOW-MO === */
#eventBanner{position:fixed;top:31%;left:50%;transform:translateX(-50%) scale(.85);background:rgba(12,8,28,0.92);border:2px solid #FFB300;border-radius:14px;padding:10px 22px;font-size:18px;font-weight:800;letter-spacing:.5px;color:#fff;box-shadow:0 0 26px rgba(255,179,0,.55);opacity:0;pointer-events:none;z-index:96}
#eventBanner.show{animation:eventPop 2.3s cubic-bezier(.2,.9,.3,1.2) forwards}
#eventBanner.b-speed{border-color:#FFB300;box-shadow:0 0 26px rgba(255,179,0,.6)}
#eventBanner.b-power{border-color:#39FF14;box-shadow:0 0 24px rgba(57,255,20,.55)}
#eventBanner.b-boss{border-color:#FF2244;box-shadow:0 0 30px rgba(255,34,68,.7);color:#FFDDE2}
#eventBanner.b-win{border-color:#FFD700;box-shadow:0 0 30px rgba(255,215,0,.7);color:#FFF3B0}
@keyframes eventPop{0%{opacity:0;transform:translateX(-50%) scale(.7)}8%{opacity:1;transform:translateX(-50%) scale(1.06)}14%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.02)}}
#pop{position:fixed;top:37%;left:50%;transform:translateX(-50%);font-size:24px;font-weight:900;color:#FFE066;text-shadow:0 2px 8px rgba(0,0,0,.55),0 0 14px rgba(255,220,100,.7);opacity:0;pointer-events:none;z-index:98;white-space:nowrap}
#pop.show{animation:popRise .95s ease-out forwards}
@keyframes popRise{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.8)}15%{opacity:1;transform:translateX(-50%) translateY(0) scale(1.1)}25%{transform:translateX(-50%) translateY(-4px) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-44px) scale(1)}}
#slowFx{position:fixed;inset:0;background:radial-gradient(circle at 50% 55%,rgba(0,229,255,.14) 0%,rgba(20,60,120,.3) 100%);opacity:0;pointer-events:none;transition:opacity .35s;z-index:88}
#slowFx.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fl"></div>
<div id="warpFlash"></div>
<div id="spaceBanner">
  <div class="banner-title">TIẾN VÀO KHÔNG GIAN!</div>
  <div class="banner-sub">Né các chướng ngại vật!</div>
</div>
<div id="eventBanner"></div>
<div id="pop"></div>
<div id="slowFx"></div>
<div id="hud">
  <div class="card" id="scoreCard" style="pointer-events:auto;cursor:pointer" title="Thử nghiệm: nhấn T/G để tới mốc không gian, B để triệu boss"><small>Điểm</small><b id="sc">00000</b></div>
  <div class="card"><small>Kỷ lục</small><b id="hi">00000</b></div>
</div>
<div id="msg"><div class="card"><h1 id="t">Khủng long 3D</h1><p id="s">Chạm màn hình để chạy và nhảy qua chướng ngại vật</p></div></div>
<button id="soundBtn" title="Tắt/Bật âm thanh" onclick="event.stopPropagation();toggleSound()"><span class="icon-on">🔊</span><span class="icon-off">🔇</span><div class="slash"></div></button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// === HỆ THỐNG ÂM THANH ===
var audioCtx=null,muted=false,bgmGain=null,sfxGain=null,bgmStarted=false;
function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    bgmGain=audioCtx.createGain();bgmGain.gain.value=0.22;bgmGain.connect(audioCtx.destination);
    sfxGain=audioCtx.createGain();sfxGain.gain.value=0.45;sfxGain.connect(audioCtx.destination);
  }catch(e){audioCtx=null;}
}
var bgmInterval=null,bgmIndex=0;
var bgmMelody=[523.25,587.33,659.25,698.46,783.99,698.46,659.25,587.33,523.25,493.88,440.00,493.88,523.25,587.33,659.25,783.99,698.46,659.25,587.33,523.25,493.88,523.25,587.33,659.25,783.99,880.00,783.99,698.46,659.25,587.33,523.25,493.88,440.00,493.88,523.25,587.33,659.25,783.99,880.00,783.99,698.46,783.99,880.00,1046.50,880.00,783.99,698.46,659.25];
var bgmBass=[261.63,261.63,329.63,329.63,349.23,349.23,293.66,293.66,261.63,261.63,220.00,220.00,261.63,261.63,329.63,329.63,349.23,349.23,293.66,293.66,246.94,246.94,261.63,261.63,392.00,392.00,349.23,349.23,329.63,329.63,261.63,261.63,220.00,220.00,261.63,261.63,329.63,329.63,392.00,392.00,349.23,349.23,440.00,440.00,392.00,392.00,349.23,349.23];
var bgmBeat=0;
// Chủ đề nhạc: 'earth' (chiptune nền đất) <-> 'space' (synthwave vũ trụ, chậm hơn)
var bgmTheme='earth';
var bgmMelodySpace=[329.63,392,493.88,587.33,493.88,392,329.63,246.94,329.63,392,493.88,659.25,587.33,493.88,392,329.63,220,261.63,329.63,440,329.63,261.63,220,196,220,261.63,329.63,493.88,440,329.63,261.63,220];
var bgmBassSpace=[110,110,146.83,146.83,98,98,110,110,110,110,164.81,164.81,123.47,123.47,110,110,82.41,82.41,110,110,98,98,146.83,146.83,110,110,123.47,123.47,98,98,110,110];
function setBgmTheme(th){if(bgmTheme===th)return;bgmTheme=th;if(bgmStarted){clearInterval(bgmInterval);bgmInterval=setInterval(playBgmNote,th==='space'?170:150);}}
function playBgmNote(){
  if(!audioCtx||muted)return;
  var now=audioCtx.currentTime,sp=bgmTheme==='space',mel=sp?bgmMelodySpace:bgmMelody,idx=bgmIndex%mel.length;
  var osc=audioCtx.createOscillator(),env=audioCtx.createGain();
  osc.type=sp?'sawtooth':'square';osc.frequency.value=mel[idx];
  env.gain.setValueAtTime(0.09,now);env.gain.exponentialRampToValueAtTime(0.001,now+0.14);
  osc.connect(env);env.connect(bgmGain);osc.start(now);osc.stop(now+0.15);
  var bass=audioCtx.createOscillator(),bassEnv=audioCtx.createGain();
  bass.type=sp?'sawtooth':'square';bass.frequency.value=(sp?bgmBassSpace:bgmBass)[idx];
  bassEnv.gain.setValueAtTime(0.07,now);bassEnv.gain.exponentialRampToValueAtTime(0.001,now+0.12);
  bass.connect(bassEnv);bassEnv.connect(bgmGain);bass.start(now);bass.stop(now+0.13);
  bgmBeat++;
  if(bgmBeat%2===0){var hh=audioCtx.createBufferSource(),hhBuf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.03,audioCtx.sampleRate),hhData=hhBuf.getChannelData(0);for(var i=0;i<hhData.length;i++)hhData[i]=(Math.random()*2-1)*Math.pow(1-i/hhData.length,3);hh.buffer=hhBuf;var hhGain=audioCtx.createGain();hhGain.gain.value=0.04;hh.connect(hhGain);hhGain.connect(bgmGain);hh.start(now);}
  if(bgmBeat%4===0){var kick=audioCtx.createOscillator(),kickEnv=audioCtx.createGain();kick.type='sine';kick.frequency.setValueAtTime(120,now);kick.frequency.exponentialRampToValueAtTime(40,now+0.08);kickEnv.gain.setValueAtTime(0.1,now);kickEnv.gain.exponentialRampToValueAtTime(0.001,now+0.1);kick.connect(kickEnv);kickEnv.connect(bgmGain);kick.start(now);kick.stop(now+0.11);}
  bgmIndex++;
}
function startBgm(){if(bgmStarted||muted)return;bgmStarted=true;bgmIndex=0;bgmBeat=0;bgmInterval=setInterval(playBgmNote,bgmTheme==='space'?170:150);}
function stopBgm(){if(bgmInterval){clearInterval(bgmInterval);bgmInterval=null;}bgmStarted=false;}
function playJumpSound(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  var osc=audioCtx.createOscillator(),env=audioCtx.createGain();osc.type='sine';
  osc.frequency.setValueAtTime(280,now);osc.frequency.exponentialRampToValueAtTime(880,now+0.12);
  env.gain.setValueAtTime(0.3,now);env.gain.exponentialRampToValueAtTime(0.001,now+0.2);
  osc.connect(env);env.connect(sfxGain);osc.start(now);osc.stop(now+0.22);
  var osc2=audioCtx.createOscillator(),env2=audioCtx.createGain();osc2.type='triangle';
  osc2.frequency.setValueAtTime(450,now);osc2.frequency.exponentialRampToValueAtTime(1100,now+0.09);
  env2.gain.setValueAtTime(0.12,now);env2.gain.exponentialRampToValueAtTime(0.001,now+0.14);
  osc2.connect(env2);env2.connect(sfxGain);osc2.start(now);osc2.stop(now+0.16);
}
function playGameOverSound(){
  if(!audioCtx||muted)return;stopBgm();var now=audioCtx.currentTime;
  var noise=audioCtx.createBufferSource(),buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.35,audioCtx.sampleRate),data=buf.getChannelData(0);
  for(var i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);
  noise.buffer=buf;var nGain=audioCtx.createGain();nGain.gain.setValueAtTime(0.28,now);nGain.gain.exponentialRampToValueAtTime(0.001,now+0.35);
  noise.connect(nGain);nGain.connect(sfxGain);noise.start(now);
  var kick=audioCtx.createOscillator(),kickEnv=audioCtx.createGain();kick.type='sine';
  kick.frequency.setValueAtTime(160,now);kick.frequency.exponentialRampToValueAtTime(25,now+0.25);
  kickEnv.gain.setValueAtTime(0.4,now);kickEnv.gain.exponentialRampToValueAtTime(0.001,now+0.28);
  kick.connect(kickEnv);kickEnv.connect(sfxGain);kick.start(now);kick.stop(now+0.3);
  [523.25,493.88,440,392,349.23,329.63,293.66,261.63,220,196].forEach(function(freq,i){
    var tt=now+0.35+i*0.1,o=audioCtx.createOscillator(),e=audioCtx.createGain();o.type='square';o.frequency.value=freq;
    e.gain.setValueAtTime(0.12,tt);e.gain.exponentialRampToValueAtTime(0.001,tt+0.09);o.connect(e);e.connect(sfxGain);o.start(tt);o.stop(tt+0.1);
  });
}
function playScoreSound(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  var o1=audioCtx.createOscillator(),e1=audioCtx.createGain();o1.type='sine';
  o1.frequency.setValueAtTime(880,now);o1.frequency.setValueAtTime(1108.73,now+0.06);
  e1.gain.setValueAtTime(0.2,now);e1.gain.exponentialRampToValueAtTime(0.001,now+0.15);
  o1.connect(e1);e1.connect(sfxGain);o1.start(now);o1.stop(now+0.17);
  var o2=audioCtx.createOscillator(),e2=audioCtx.createGain();o2.type='sine';o2.frequency.value=1318.51;
  e2.gain.setValueAtTime(0,now);e2.gain.setValueAtTime(0.15,now+0.08);e2.gain.exponentialRampToValueAtTime(0.001,now+0.2);
  o2.connect(e2);e2.connect(sfxGain);o2.start(now);o2.stop(now+0.22);
}
// Âm thanh bước nhảy siêu không gian (Hyperspace Warp Jump)
function playWarpSound(){
  if(!audioCtx||muted)return;
  var now=audioCtx.currentTime;
  var sub=audioCtx.createOscillator(),subGain=audioCtx.createGain();
  sub.type='sine';sub.frequency.setValueAtTime(340,now);sub.frequency.exponentialRampToValueAtTime(45,now+1.2);
  subGain.gain.setValueAtTime(0.5,now);subGain.gain.exponentialRampToValueAtTime(0.001,now+1.4);
  sub.connect(subGain);subGain.connect(sfxGain);sub.start(now);sub.stop(now+1.4);

  var sweep=audioCtx.createOscillator(),sweepGain=audioCtx.createGain();
  sweep.type='sawtooth';sweep.frequency.setValueAtTime(220,now);sweep.frequency.exponentialRampToValueAtTime(1800,now+0.9);
  sweepGain.gain.setValueAtTime(0.18,now);sweepGain.gain.exponentialRampToValueAtTime(0.001,now+1.0);
  sweep.connect(sweepGain);sweepGain.connect(sfxGain);sweep.start(now);sweep.stop(now+1.0);

  [659.25,880,1174.66,1567.98].forEach(function(freq,i){
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=freq;
    var t=now+0.6+i*0.1;
    g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.8);
    o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+0.8);
  });
}
// Tiếng ăn trứng vàng
function playCollectSound(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  [[1318.51,0,.14],[1760,.07,.16],[2217.46,.13,.12]].forEach(function(n){
    var o=audioCtx.createOscillator(),e=audioCtx.createGain();o.type='sine';o.frequency.value=n[0];
    e.gain.setValueAtTime(.16,now+n[1]);e.gain.exponentialRampToValueAtTime(.001,now+n[1]+n[2]);
    o.connect(e);e.connect(sfxGain);o.start(now+n[1]);o.stop(now+n[1]+n[2]+.02);
  });
}
// Tiếng graze (né sát vật cản)
function playGrazeSound(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  var o=audioCtx.createOscillator(),e=audioCtx.createGain();o.type='square';
  o.frequency.setValueAtTime(660,now);o.frequency.exponentialRampToValueAtTime(990,now+.06);
  e.gain.setValueAtTime(.08,now);e.gain.exponentialRampToValueAtTime(.001,now+.09);
  o.connect(e);e.connect(sfxGain);o.start(now);o.stop(now+.1);
}
// Tiếng nhặt power-up
function playPowerSound(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  [523.25,659.25,783.99,1046.5].forEach(function(f,i){
    var o=audioCtx.createOscillator(),e=audioCtx.createGain();o.type='sawtooth';o.frequency.value=f;
    var t0=now+i*.07;e.gain.setValueAtTime(.11,t0);e.gain.exponentialRampToValueAtTime(.001,t0+.16);
    o.connect(e);e.connect(sfxGain);o.start(t0);o.stop(t0+.17);
  });
}
// Tiếng mốc 2.500 điểm (tăng tốc)
function playMilestoneSound(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  [[880,0],[1174.66,.08],[1567.98,.16]].forEach(function(n){
    var o=audioCtx.createOscillator(),e=audioCtx.createGain();o.type='square';o.frequency.value=n[0];
    var t0=now+n[1];e.gain.setValueAtTime(.13,t0);e.gain.exponentialRampToValueAtTime(.001,t0+.12);
    o.connect(e);e.connect(sfxGain);o.start(t0);o.stop(t0+.13);
  });
}
// Tiếng bắn đạn/laser của boss
function playLaserSound(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  var o=audioCtx.createOscillator(),e=audioCtx.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(1400,now);o.frequency.exponentialRampToValueAtTime(280,now+.22);
  e.gain.setValueAtTime(.09,now);e.gain.exponentialRampToValueAtTime(.001,now+.24);
  o.connect(e);e.connect(sfxGain);o.start(now);o.stop(now+.25);
}
// Tiếng nổ lớn (bom boss nổ / boss thua)
function playBoomSound(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  var noise=audioCtx.createBufferSource(),buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.5,audioCtx.sampleRate),data=buf.getChannelData(0);
  for(var i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,1.6);
  noise.buffer=buf;var ng=audioCtx.createGain();ng.gain.setValueAtTime(.34,now);ng.gain.exponentialRampToValueAtTime(.001,now+.5);
  noise.connect(ng);ng.connect(sfxGain);noise.start(now);
  var k=audioCtx.createOscillator(),ke=audioCtx.createGain();k.type='sine';
  k.frequency.setValueAtTime(180,now);k.frequency.exponentialRampToValueAtTime(30,now+.45);
  ke.gain.setValueAtTime(.4,now);ke.gain.exponentialRampToValueAtTime(.001,now+.48);
  k.connect(ke);ke.connect(sfxGain);k.start(now);k.stop(now+.5);
}
// Tiếng còi cảnh báo boss xuất hiện
function playBossWarn(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  for(var w=0;w<2;w++){
    var o=audioCtx.createOscillator(),e=audioCtx.createGain();o.type='sawtooth';
    o.frequency.setValueAtTime(196,now+w*.65);o.frequency.exponentialRampToValueAtTime(392,now+w*.65+.28);
    o.frequency.exponentialRampToValueAtTime(196,now+w*.65+.56);
    e.gain.setValueAtTime(.2,now+w*.65);e.gain.exponentialRampToValueAtTime(.001,now+w*.65+.6);
    o.connect(e);e.connect(sfxGain);o.start(now+w*.65);o.stop(now+w*.65+.62);
  }
}
function toggleSound(){
  initAudio();muted=!muted;var btn=document.getElementById('soundBtn');
  if(muted){btn.classList.add('muted');btn.title='Bật âm thanh';stopBgm();if(bgmGain)bgmGain.gain.value=0;if(sfxGain)sfxGain.gain.value=0;}
  else{btn.classList.remove('muted');btn.title='Tắt âm thanh';if(bgmGain)bgmGain.gain.value=0.22;if(sfxGain)sfxGain.gain.value=0.45;}
}
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){$('t').textContent='Không tải được thư viện 3D';return;}
const pad=n=>String(n).padStart(5,'0');

// === NHẬN DIỆN THIẾT BỊ VÀ TỐI ƯU HÓA CHO ĐIỆN THOẠI YẾU ===
const isMobile=/Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)||(window.innerWidth<800);
const renderer=new THREE.WebGLRenderer({
  canvas:$('c'),
  antialias:!isMobile,
  powerPreference:'high-performance',
  precision:isMobile?'mediump':'highp',

const todResult={phase:'day',blend:0,next:'day'};
function getTimeOfDay(score){
  const pos=(score%DAY_CYCLE)/DAY_CYCLE;
  if(pos<0.4){todResult.phase='day';todResult.blend=0;todResult.next='day';}
  else if(pos<0.45){todResult.phase='day';todResult.blend=(pos-0.4)/0.05;todResult.next='sunset';}
  else if(pos<0.55){todResult.phase='sunset';todResult.blend=0;todResult.next='sunset';}
  else if(pos<0.6){todResult.phase='sunset';todResult.blend=(pos-0.55)/0.05;todResult.next='night';}
  else if(pos<0.8){todResult.phase='night';todResult.blend=0;todResult.next='night';}
  else if(pos<0.85){todResult.phase='night';todResult.blend=(pos-0.8)/0.05;todResult.next='dawn';}
  else if(pos<0.95){todResult.phase='dawn';todResult.blend=0;todResult.next='dawn';}
  else{todResult.phase='dawn';todResult.blend=(pos-0.95)/0.05;todResult.next='day';}
  return todResult;
}

function lerpColor(c1,c2,t){
  const r1=(c1>>16)&0xFF,g1=(c1>>8)&0xFF,b1=c1&0xFF;
  const r2=(c2>>16)&0xFF,g2=(c2>>8)&0xFF,b2=c2&0xFF;
  return((r1+Math.round((r2-r1)*t))<<16)|((g1+Math.round((g2-g1)*t))<<8)|(b1+Math.round((b2-b1)*t));
}
function lerpVal(a,b,t){return a+(b-a)*t;}

function updateBoss(dtE,mv){
  if(!bossActive)return;
  bossT+=dtE;
  for(let i=bossShots.length-1;i>=0;i--){
    const s=bossShots[i];
    s.vy+=26*dtE;s.g.position.y-=s.vy*dtE;s.g.position.z+=mv*.85;s.g.rotation.x+=dtE*2;
    if(s.g.position.y<=.25){bossShock(s.g.position.x,s.g.position.z);scene.remove(s.g);bossShots.splice(i,1);}
  }
  if(bossPhase==='warn'){
    bossGroup.position.y=Math.max(16,40-bossT*17);
    if(bossT>1.4){bossPhase='fight';bossT=0;bossCd=.7;bossAttacks=0;}

    bossGroup.position.y=16+Math.sin(t*2.2)*1.1;

      else if(r<.8){bossDropBomb();bossCd=1.5;}
      else{bossFireLaser();bossCd=1.9-.06*bossAttacks;}
    }
    if(bossAttacks>=8&&bossCd<=-2.2){bossPhase='defeat';bossT=0;playBoomSound();}
  }else if(bossPhase==='defeat'){
    bossGroup.position.y+=8*dtE;bossGroup.rotation.z+=dtE*2.2;bossGroup.rotation.y+=dtE*3;
    if(Math.random()<dtE*6)burst((Math.random()-.5)*8,bossGroup.position.y+(Math.random()-.5)*3,bossGroup.position.z+2);

      score+=500;popup('+500 🏆');showBanner('🏆 ĐÃ HẠ TÀU MẸ!','b-win');haptic([30,40,120]);
    }
  }
}

  for(let i=0;i<bossShots.length;i++)scene.remove(bossShots[i].g);bossShots.length=0;
  dist=0;score=0;lastScoreColor=-1;speed=20;py=0;vy=0;gap=40;jumpBuf=0;
  dino.rotation.set(0,0,0);dino.position.set(0,0,0);dino.scale.set(1,1,1);hitObs=null;
  for(let i=0;i<parts.length;i++){parts[i].life=0;parts[i].m.visible=false;}

  // Reset trạng thái không gian về mặt đất ban đầu
  inSpace=false;
  spaceT=0;
  scene.fog.near=30;
  scene.fog.far=130;
  hemiLight.color.setHex(0xffffff);
  moonLight.color.setHex(0x98C0FF);
  astroHelmet.visible=false;
  oxyGroup.forEach(m=>{m.visible=false;});
  spaceGroup.visible=false;
  sunSphere.scale.set(1,1,1);
  moonSphere.scale.set(1,1,1);
  for(let i=0;i<mountains.length;i++){mountains[i].visible=true;mountains[i].position.y=mountains[i].userData.baseH;}
  for(let i=0;i<snowCaps.length;i++){snowCaps[i].visible=true;snowCaps[i].position.y=snowCaps[i].userData.baseH;}
  for(let i=0;i<decor.length;i++){decor[i].visible=true;decor[i].position.y=decor[i].userData.y||0;}
  for(let i=0;i<ripples.length;i++){ripples[i].visible=true;ripples[i].position.y=0.03;}
  for(let i=0;i<clouds.length;i++){clouds[i].visible=true;}

  // Reset trạng thái nâng cấp V2
  jumpsLeft=1;lastDouble=false;duckLerp=0;keyDuck=false;ptrDuck=false;duckHeld=false;
  combo=0;comboUntil=0;shield=0;invulnUntil=0;magnetUntil=0;slowUntil=0;rocketUntil=0;
  eggCd=6;powerTimer=9;milestoneNext=2500;wSnow=0;
  bossNext=20000;bossActive=false;bossPhase='gone';bossGroup.visible=false;
  bossGroup.position.set(0,40,-55);bossGroup.rotation.set(0,0,0);
  slowEl.classList.remove('on');snowMat.opacity=0;
  setBgmTheme('earth');

  $('sc').textContent=pad(0);msg.style.display='none';state='play';
  startBgm();
}
function die(o){
  playGameOverSound();haptic([50,30,90]);
  state='over';overT=0;shake=.7;punch=1;hitObs=o||null;dvy=10;dvz=9;
  burst(o?o.g.position.x:0,1.6,o?o.g.position.z:-1.5);
  const fl=$('fl');fl.style.transition='none';fl.style.opacity='.5';void fl.offsetWidth;fl.style.transition='opacity .6s';fl.style.opacity='0';
  if(score>hi){hi=score;$('hi').textContent=pad(hi);try{localStorage.setItem('dino3d_hi',hi);}catch(e){}}
  $('t').textContent='Game over';
  $('s').textContent='Điểm '+score+'. Chạm để chơi lại .Được làm bởi: Minh Long';
  setTimeout(()=>{if(state==='over')msg.style.display='flex';},700);
}
function act(){
  initAudio();
  if(state==='ready'){state='play';msg.style.display='none';startBgm();}
  else if(state==='over'){if(overT>.5)reset();else return;}
  jumpBuf=.14;
}
addEventListener('pointerdown',e=>{e.preventDefault();pDownY=e.clientY;pDownT=performance.now();ptrDuck=false;act();},{passive:false});
addEventListener('pointermove',e=>{if(!ptrDuck&&performance.now()-pDownT<260&&e.clientY-pDownY>46)ptrDuck=true;});
addEventListener('pointerup',()=>{ptrDuck=false;if(lastDouble&&py>0&&vy>6)vy*=.75;lastDouble=false;});
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'){e.preventDefault();if(!e.repeat)act();}
  // Giữ ↓ hoặc S: cúi trên đất, rơi nhanh trên không
  if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();keyDuck=true;}
  // Phím tắt 'T' hoặc 'G' để thử nghiệm nhanh mốc 10.000 điểm (tiến vào không gian)
  if(e.code==='KeyT'||e.code==='KeyG'){triggerSpaceTest();}
  // Phím 'B' để thử ngay trận boss tàu mẹ
  if(e.code==='KeyB'){if(state!=='play')act();dist=(20000-10)/.4;}
});
addEventListener('keyup',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'){if(lastDouble&&py>0&&vy>6)vy*=.75;lastDouble=false;}
  if(e.code==='ArrowDown'||e.code==='KeyS')keyDuck=false;
});

// Cho phép nhấp vào ô Điểm để nhảy nhanh tới mốc không gian xem thử hiệu ứng
function triggerSpaceTest(){
  if(state!=='play')act();
  dist=(SPACE_THRESHOLD-5)/0.4;
  score=Math.floor(dist*0.4);
  $('sc').textContent=pad(score);
}
// $('scoreCard').addEventListener('pointerdown',e=>{e.stopPropagation();triggerSpaceTest();});

function resize(){
  const w=innerWidth,h=innerHeight,a=w/h;
  const dpr=isMobile?1.0:1.5;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,dpr));
  renderer.setSize(w,h,false);
  cam.aspect=a;
  baseFov=a<.8?70:a<1.3?62:54;
  cam.fov=baseFov;
  cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

// === VÒNG LẶP CHÍNH (TÍCH HỢP HIỆU ỨNG VŨ TRỤ KHI ĐẠT MỐC KHÔNG GIAN) ===
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.035);last=now;t+=dt;
  let mv=0;

  if(state==='play'){
    const prevScore=score;
    score=Math.floor(dist*.4);
    if(Math.floor(score/100)>Math.floor(prevScore/100)) playScoreSound();
    const dtE=dt*((t<slowUntil)?.55:1);
    speed=(20+Math.min(32,score*.02))*((t<rocketUntil)?1.55:1);
    mv=speed*dtE;dist+=mv;
    if(!bossActive){gap-=mv;if(gap<=0){spawn();gap=speed*(1.1+Math.random())+6;}}
    duckHeld=keyDuck||ptrDuck;
    if(jumpBuf>0){
      jumpBuf-=dtE;
      if(py<=0){vy=JUMP;py=.01;jumpBuf=0;jumpDir=-jumpDir;lastDouble=false;puff(0,.2,.5,4);playJumpSound();haptic(10);}
      else if(jumpsLeft>0){jumpsLeft--;vy=JUMP*.86;py=Math.max(py,.01);jumpBuf=0;jumpDir=-jumpDir;lastDouble=true;puff(0,py+.3,.3,5);playJumpSound();haptic(8);}
    }
    if(py>0){
      const g2=(duckHeld)?GRAV*2.1:GRAV;  // giữ ↓ để rơi nhanh
      vy-=g2*dtE;py+=vy*dtE;
      if(py<=0){py=0;vy=0;land=.18;shake=Math.max(shake,.07);jumpsLeft=1;puff(0,.12,.5,3);haptic(8);}
    }
    const duckWant=(duckHeld&&py<=0)?1:0;
    duckLerp+=(duckWant-duckLerp)*Math.min(1,dtE*12);
    for(let i=obs.length-1;i>=0;i--){
      const o=obs[i];
      o.g.position.z+=mv+(o.boost||0)*dtE;
      if(o.waveAge!==undefined){o.waveAge+=dtE;o.g.scale.setScalar(Math.min(2.2,1+o.waveAge*1.9));o.g.rotation.z+=dtE*2;}
      const z=o.g.position.z;
      const baseY=o.g.userData.flying?o.g.position.y:0;
      if(o.knocked)continue;
      const inBand=z+o.d/2>-1.5&&z-o.d/2<1;
      if(inBand&&Math.abs(o.g.position.x)<o.w*.35+.5&&py<(baseY+o.h)*.85&&py+(3.4-1.4*duckLerp)>baseY){
        if(t<rocketUntil){score+=15;o.g.rotation.x+=.9;burst(o.g.position.x,1.4,z);scene.remove(o.g);obs.splice(i,1);continue;}
        if(t<invulnUntil)continue;
        if(shield>0){
          shield=0;invulnUntil=t+1.5;shake=.55;
          const fl=$('fl');fl.style.transition='none';fl.style.opacity='.4';void fl.offsetWidth;fl.style.transition='opacity .4s';fl.style.opacity='0';
          popup('🛡');playPowerSound();haptic(35);burst(o.g.position.x,1.6,z);
          o.knocked=true;o.g.rotation.z=.5;continue;
        }
        die(o);break;
      }else if(inBand&&!o.near&&(py>.3||duckLerp>.5)){o.near=true;}
      else if(!inBand&&o.near&&!o.scored&&z>1.2){
        o.scored=true;if(combo<9)combo++;comboUntil=t+5;
        score+=25*combo;
        if(combo>=3){popup('🔥x'+combo);playGrazeSound();haptic(8);}
      }
    }
    for(let i=obs.length-1;i>=0;i--)if(obs[i].g.position.z>12){scene.remove(obs[i].g);obs.splice(i,1);}

    // === TRỨNG VÀNG: sinh, bị nam châm hút, ăn +50 ===
    eggCd-=dtE;
    if(eggCd<=0&&spaceT<.6){eggCd=7+Math.random()*6;spawnEggs();}
    for(let i=eggs.length-1;i>=0;i--){
      const g=eggs[i];
      g.position.z+=mv;g.rotation.y+=dtE*2;
      if(t<magnetUntil&&g.position.z<40){
        g.position.x+=(0-g.position.x)*Math.min(1,dtE*3);
        g.position.y+=((py+1.6)-g.position.y)*Math.min(1,dtE*3);
        g.position.z+=14*dtE;
      }
      if(g.position.z>-1.6&&g.position.z<1.4&&Math.abs(g.position.x)<1&&Math.abs((py+1.4)-g.position.y)<1.7){
        scene.remove(g);eggs.splice(i,1);score+=50;
        popup('+50');playCollectSound();haptic(10);continue;
      }
      if(g.position.z>12){scene.remove(g);eggs.splice(i,1);}
    }

    // === POWER-UP: sinh định kỳ, xoay tròn, nhặt vào bật hiệu ứng ===
    powerTimer-=dtE;
    if(powerTimer<=0){powerTimer=10+Math.random()*7;spawnPower();}
    for(let i=powerups.length-1;i>=0;i--){
      const g=powerups[i];
      g.position.z+=mv;g.rotation.y+=dtE*2.4;g.position.y+=Math.sin(t*3+i)*dtE*.6;
      if(g.position.z>-1.8&&g.position.z<1.6&&Math.abs(g.position.x)<1.1&&py+1.4>g.position.y-1.5&&py+1.4<g.position.y+2.1){
        const ty=g.userData.type;
        scene.remove(g);powerups.splice(i,1);
        playPowerSound();haptic(25);burst(g.position.x,g.position.y,.5);
        if(ty==='shield')shield=1;
        else if(ty==='magnet')magnetUntil=t+10;
        else if(ty==='slow'){slowUntil=t+3.2;slowEl.classList.add('on');}
        else rocketUntil=t+5;
        popup({shield:'🛡',magnet:'🧲',slow:'⏱',rocket:'🚀'}[ty]);
        continue;
      }
      if(g.position.z>12){scene.remove(g);powerups.splice(i,1);}
    }
    if(t>slowUntil)slowEl.classList.remove('on');

    // Đuôi lửa rocket
    if(t<rocketUntil){
      trailCd-=dt;
      if(trailCd<=0){
        trailCd=.05;
        const p=trailParts[trailIdx=(trailIdx+1)%trailParts.length];
        p.m.visible=true;p.m.position.set((Math.random()-.5)*.5,1+Math.random()*.6,dino.position.z+1.4);
        p.vx=(Math.random()-.5)*2;p.vy=2+Math.random()*2;p.vz=6+Math.random()*4;p.life=.5;
      }
    }

    // Combo hết hạn
    if(combo>0&&t>comboUntil)combo=0;

    // === SỰ KIỆN MỐC 2.500 ĐIỂM: TỐC ĐỘ TĂNG ===
    if(score>=milestoneNext&&score<SPACE_THRESHOLD-200){
      milestoneNext+=2500;
      showBanner('⚡ TỐC ĐỘ TĂNG!','b-speed');punch=.45;
      playMilestoneSound();haptic(20);
    }
    // === TRÙM XUẤT HIỆN MỖI 20.000 ĐIỂM (khi đang trong không gian) ===
    if(!bossActive&&score>=bossNext&&inSpace){
      bossNext+=20000;startBoss();
    }
    updateBoss(dtE,mv);

    $('sc').textContent=pad(score);
  }

  // === KIỂM TRA MỐC ĐIỂM ĐỂ KÍCH HOẠT HIỆU ỨNG VÀO KHÔNG GIAN ===
  if(score>=SPACE_THRESHOLD&&!inSpace){
    inSpace=true;
    playWarpSound();
    // Chớp sáng siêu không gian (Warp Flash)
    const wf=$('warpFlash');
    wf.style.transition='none';
    wf.style.opacity='0.9';
    void wf.offsetWidth;
    wf.style.transition='opacity 1.2s ease-out';
    wf.style.opacity='0';
    // Hiện banner thông báo hoành tráng
    const sb=$('spaceBanner');
    sb.classList.add('show');
    setTimeout(()=>{sb.classList.remove('show');},4500);
    // Đội mũ phi hành gia cho khủng long
    astroHelmet.visible=true;
    oxyGroup.forEach(m=>{m.visible=true;});
  }

  // Tiến trình chuyển đổi không gian (mượt mà trong 2.5s)
  if(inSpace&&spaceT<1.0)spaceT=Math.min(1.0,spaceT+dt*0.45);
  if(!inSpace&&spaceT>0.0)spaceT=Math.max(0.0,spaceT-dt*0.8);

  // === CẬP NHẬT MÔI TRƯỜNG & CHU KỲ (NGÀY/ĐÊM HOẶC KHÔNG GIAN) ===
  const tod=getTimeOfDay(score);
  const bl=tod.blend;
  const isNight=(tod.phase==='night'||(tod.phase==='sunset'&&bl>0.5))?1:0;

  if(score!==lastScoreColor||spaceT>0){
    lastScoreColor=score;
    const phA=timePhases[tod.phase],phB=timePhases[tod.next];
    let curSky=lerpColor(phA.sky,phB.sky,bl);
    let curFog=lerpColor(phA.fog,phB.fog,bl);
    let curGround=lerpColor(phA.ground,phB.ground,bl);
    let curLane=lerpColor(phA.lane,phB.lane,bl);
    let curSunC=lerpColor(phA.sunC,phB.sunC,bl);
    let curSunI=lerpVal(phA.sunI,phB.sunI,bl);
    let curHemiI=lerpVal(phA.hemiI,phB.hemiI,bl);
    let curMountain=lerpColor(phA.mountainC,phB.mountainC,bl);

    // Khi bước vào không gian, màu sắc vũ trụ sắc nét và ánh sáng rực rỡ để nhìn rõ vật cản
    if(spaceT>0){
      curSky=lerpColor(curSky,0x0D092A,spaceT);
      curFog=lerpColor(curFog,0x18103A,spaceT);
      curGround=lerpColor(curGround,0x100C2A,spaceT);
      curLane=lerpColor(curLane,0x281F4E,spaceT); // Lòng đường tím cyber sáng rõ, tương phản mạnh với vật thể
      curSunC=lerpColor(curSunC,0xEDF4FF,spaceT); // Ánh sáng tinh tú trắng xanh vũ trụ rực rỡ
      curSunI=lerpVal(curSunI,1.0,spaceT); // Chiếu sáng trực tiếp công suất cao
      curHemiI=lerpVal(curHemiI,1.3,spaceT); // Ánh sáng môi trường mạnh mẽ chiếu sáng đều các khối 3D
      // Viền đường neon cyan và vạch kẻ neon magenta
      const edgeNeon=lerpColor(isNight?0xDCE8FF:0xE8DCC0,0x00FFFF,spaceT);
      const dashNeon=lerpColor(isNight?0x88A6C5:0xD0C098,0xFF1493,spaceT);
      edgeMat.color.setHex(edgeNeon);
      dashMat.color.setHex(dashNeon);
      // Đẩy xa sương mù trong vũ trụ để quan sát thấy rõ vật cản ngay từ khoảng cách xa
      scene.fog.near=lerpVal(30,80,spaceT);
      scene.fog.far=lerpVal(130,240,spaceT);
    }else{
      edgeMat.color.setHex(isNight?0xDCE8FF:0xE8DCC0);
      dashMat.color.setHex(isNight?0x88A6C5:0xD0C098);
      scene.fog.near=30;
      scene.fog.far=130;
    }

    scene.background.setHex(curSky);
    scene.fog.color.setHex(curFog);
    groundMat.color.setHex(curGround);
    laneMat.color.setHex(curLane);
    mountainMat.color.setHex(curMountain);
    if(wSnow>.03){
      groundMat.color.setHex(lerpColor(curGround,0xD9E6EC,wSnow*.55));
      laneMat.color.setHex(lerpColor(curLane,0xE8E0CE,wSnow*.4));
      mountainMat.color.setHex(lerpColor(curMountain,0xE8F2F8,wSnow*.55));
    }
    sun.color.setHex(curSunC);
    sun.intensity=curSunI;
    hemiLight.intensity=curHemiI;
    hemiLight.groundColor.setHex(curGround);

    cloudMat.opacity=0.85*(tod.phase==='night'?0.45:tod.phase==='sunset'?0.7:1.0)*(1-spaceT);
  }

  // Chuyển đổi cảnh vật khi vào không gian
  if(spaceT>0){
    const showEarth=(spaceT<0.96);
    // Các dãy núi và cây cỏ chìm dần vào bóng tối vũ trụ; khi vào hẳn vũ trụ thì ẩn hoàn toàn tránh nhấp nháy
    for(let i=0;i<mountains.length;i++){
      mountains[i].position.y=mountains[i].userData.baseH-spaceT*35;
      mountains[i].visible=showEarth;
    }
    for(let i=0;i<snowCaps.length;i++){
      snowCaps[i].position.y=snowCaps[i].userData.baseH-spaceT*35;
      snowCaps[i].visible=showEarth;
    }
    for(let i=0;i<decor.length;i++){
      decor[i].position.y=(decor[i].userData.y||0)-spaceT*25;
      decor[i].visible=showEarth;
    }
    for(let i=0;i<ripples.length;i++){
      ripples[i].position.y=0.03-spaceT*25;
      ripples[i].visible=showEarth;
    }
    for(let i=0;i<clouds.length;i++){
      clouds[i].visible=showEarth;
    }

    // Mặt trời & Mặt trăng thu nhỏ biến mất nhường chỗ cho vũ trụ
    sunSphere.scale.setScalar(Math.max(0.001,1-spaceT));
    moonSphere.scale.setScalar(Math.max(0.001,1-spaceT));
    sunSphere.visible=showEarth&&(sunSphere.position.y>2);
    moonSphere.visible=showEarth&&(moonSphere.position.y>2);

    // Hiển thị các hành tinh và dải ngân hà
    spaceGroup.visible=(spaceT>0.05);
    planetRing.rotation.z+=dt*0.06;
    neb1.rotation.z+=dt*0.02;
    neb2.rotation.z-=dt*0.02;
  }else{
    sunSphere.visible=(sunSphere.position.y>2);
    moonSphere.visible=(moonSphere.position.y>2);
  }

  // Vị trí mặt trời / mặt trăng
  const dayPos=(score%DAY_CYCLE)/DAY_CYCLE;
  const theta=(dayPos-0.2)*Math.PI*2;
  const sunX=Math.sin(theta)*115;
  const sunY=Math.cos(theta)*70+10;
  sunSphere.position.set(sunX,sunY,-190);
  sunSphere.material.color.setHex((dayPos>=0.38&&dayPos<0.58)?0xFF7722:(dayPos>=0.88)?0xFFAA44:0xFFEE55);

  const moonTheta=theta+Math.PI;
  const moonX=Math.sin(moonTheta)*110;
  const moonY=Math.cos(moonTheta)*65+10;
  moonSphere.position.set(moonX,moonY,-190);

  // Ánh sáng theo chu kỳ & ánh sáng viền tinh vân không gian
  if(spaceT>0){
    // Đèn viền xanh ngọc Neon từ tinh vân giúp khối 3D sắc nét
    moonLight.intensity=lerpVal(moonLight.intensity,0.7*spaceT,Math.min(1,dt*2));
    moonLight.color.setHex(lerpColor(0x98C0FF,0x00E5FF,spaceT));
    moonLight.position.set(-6,15,-10);
    // Vị trí ánh sáng chính ổn định vững chãi trong vũ trụ, không bị lắc đảo theo chu kỳ ngày đêm mặt đất
    const targetSunX=lerpVal(sunX*0.15,8,spaceT);
    const targetSunY=lerpVal(Math.max(10,sunY*0.2),16,spaceT);
    sun.position.set(targetSunX,targetSunY,20);
  }else{
    moonLight.intensity=lerpVal(moonLight.intensity,isNight?0.45:0,Math.min(1,dt*2));
    moonLight.color.setHex(0x98C0FF);
    moonLight.position.set(moonX*0.15,Math.max(8,moonY*0.2),15);
    sun.position.set(sunX*0.15,Math.max(10,sunY*0.2),20);
  }

  // Sao đêm & sao vũ trụ (lấp lánh cực đại trong không gian)
  const starTarget=(spaceT>0)?(0.95):(tod.phase==='night')?0.9:(tod.phase==='sunset'&&bl>0.6)?0.4:(tod.phase==='dawn'&&bl<0.4)?0.3:0;
  starsMat.opacity+=(starTarget-starsMat.opacity)*Math.min(1,dt*2);

  // === ĐỔI NHẠC THEO BỐI CẢNH (đất ↔ không gian) ===
  const wantTheme=(spaceT>.5)?'space':'earth';
  if(wantTheme!==bgmTheme)setBgmTheme(wantTheme);

  // === TUYẾT RƠI: đêm dày, hoàng hôn muộn vừa, bình minh gần sáng nhẹ ===
  const snowTgt=(spaceT>.4)?0:((tod.phase==='night')?1:((tod.phase==='sunset'&&bl>.5)?.7:0));
  wSnow+=(snowTgt-wSnow)*Math.min(1,dt*.8);
  snowMat.opacity=wSnow*.9;
  if(wSnow>.02){
    const arr=snowGeo.attributes.position.array;
    for(let i=0;i<snowCount;i++){
      const ix=i*3;
      arr[ix+1]-=(1.6+(i%5)*.5)*dt;
      arr[ix]+=Math.sin(t*1.3+i*.7)*dt*.6;
      if(arr[ix+1]<0){arr[ix+1]=30+Math.random()*6;arr[ix]=(Math.random()-.5)*70;arr[ix+2]=(Math.random()-.5)*70-4;}
    }
    snowGeo.attributes.position.needsUpdate=true;
  }

  if(state==='over')overT+=dt;
  const ts=state==='over'?(overT<.08?0:Math.min(1,.25+(overT-.08)*1.2)):1,sd=dt*ts;

  if(mv>0){
    if(spaceT<0.96){
      for(let i=0;i<decor.length;i++){
        decor[i].position.z+=mv;
        if(decor[i].position.z>12)placeDecor(decor[i],true);
      }
      for(let i=0;i<ripples.length;i++){
        ripples[i].position.z+=mv;
        if(ripples[i].position.z>10){ripples[i].position.z=-110;ripples[i].position.x=(Math.random()-.5)*8;}
      }
    }
    const dashLoop=dashCount*dashSpacing;
    for(let i=0;i<dashes.length;i++){
      dashes[i].position.z+=mv;
      if(dashes[i].position.z>10)dashes[i].position.z-=dashLoop;
    }
  }

  // Mây trôi
  if(spaceT<0.96){
    for(let i=0;i<clouds.length;i++){
      clouds[i].position.x+=clouds[i].userData.speed*dt;
      if(clouds[i].position.x>100)clouds[i].position.x=-100;
    }
  }

  // Cánh thằn lằn bay hoặc xoay nhẹ thiên thạch
  for(let i=0;i<obs.length;i++){
    const o=obs[i];
    if(o.g.userData.flying){
      const wt=t*8;
      if(o.g.userData.wingL){
        o.g.userData.wingL.rotation.z=Math.sin(wt)*0.4;
        o.g.userData.wingR.rotation.z=-Math.sin(wt)*0.4;
      }
      o.g.position.y=2+Math.sin(t*3)*0.5;
    }
  }

  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(p.life<=0)continue;
    p.life-=sd;p.vy-=30*sd;
    const q=p.m.position;q.x+=p.vx*sd;q.y+=p.vy*sd;q.z+=p.vz*sd;
    if(q.y<.15){q.y=.15;p.vy*=-.3;p.vx*=.7;p.vz*=.7;}
    p.m.rotation.x+=sd*8;p.m.rotation.z+=sd*6;
    p.m.scale.setScalar(Math.max(.001,Math.min(1,p.life/.4)*p.s));
    if(p.life<=0)p.m.visible=false;
  }
  // Khói nhảy & đuôi lửa rocket
  for(let i=0;i<puffParts.length;i++){
    const p=puffParts[i];
    if(p.life<=0)continue;
    p.life-=sd;p.vy-=8*sd;
    const q=p.m.position;q.x+=p.vx*sd;q.y+=p.vy*sd;q.z+=p.vz*sd;
    q.z+=mv;
    if(p.life<=0)p.m.visible=false;
  }
  for(let i=0;i<trailParts.length;i++){
    const p=trailParts[i];
    if(p.life<=0)continue;
    p.life-=sd*1.5;p.vy+=6*sd;
    const q=p.m.position;q.x+=p.vx*sd;q.y+=p.vy*sd;q.z+=p.vz*sd+mv;
    p.m.scale.setScalar(Math.max(.001,p.life*2));
    p.m.rotation.y+=sd*9;
    if(p.life<=0)p.m.visible=false;
  }

  // Hoạt ảnh khủng long
  if(state==='over'){
    dvy-=40*sd;dino.position.y+=dvy*sd;dino.position.z+=dvz*sd;
    if(dvy<0&&dino.position.y<FL){dino.position.y=FL;dvy=dvy<-4?-dvy*.3:0;dvz*=.55;}
    if(dino.position.y===FL&&dvy===0)dvz*=Math.pow(.02,sd);
    dino.rotation.x+=(1.45-dino.rotation.x)*Math.min(1,sd*5);
    dino.rotation.z+=(.35-dino.rotation.z)*Math.min(1,sd*4);
    const fl=Math.max(0,1-overT*1.5);
    legL.rotation.x=Math.sin(overT*22)*.9*fl-.3;legR.rotation.x=Math.sin(overT*22+2)*.9*fl-.3;
    armL.rotation.x=armR.rotation.x=1.2*fl+.2;
    headG.rotation.x=.3;
    dino.scale.set(1,1,1);
    if(hitObs)hitObs.g.rotation.x+=(-1.3-hitObs.g.rotation.x)*Math.min(1,sd*5);
  }else{
    runT+=dt*(state==='play'?9+speed*.25:0);
    air+=((py>0?1:0)-air)*Math.min(1,dt*14);
    land=Math.max(0,land-dt);
    const sq=land/.18,st=py>0?.08*Math.min(1,Math.abs(vy)/JUMP):0;
    dino.scale.set(1+.1*sq-st*.5,1-.15*sq+st,1+.1*sq-st*.5);
    dino.position.y=py;
    dino.rotation.x=Math.max(-.3,Math.min(.3,vy*.012));
    const s=Math.sin(runT),k=1-air,L=(a,b)=>a+(b-a)*air;
    legL.rotation.x=L(s*.9,-.9);legR.rotation.x=L(-s*.9,.6);
    armL.rotation.x=L(-s*.9,1);armR.rotation.x=L(s*.9,1);
    headG.rotation.x=L(Math.sin(runT*2)*.07,.28);
    bodyG.position.y=state==='play'&&py<=0?Math.abs(s)*.14:Math.sin(t*3)*.04;
    bodyG.rotation.z=s*.06*k;bodyG.rotation.y=s*.05*k;
    tail.rotation.y=Math.sin(runT*.8+(state==='ready'?t*2:0))*.4*k;
    tail.rotation.x=L(Math.sin(runT*2)*.06,-.35);
    // Tư thế cúi: ép thân xuống, hạ đầu, thu chân
    const dkV=duckLerp;
    if(dkV>.001){
      bodyG.scale.y=1-.45*dkV;
      bodyG.position.y-=.35*dkV;
      headG.position.y=2.8-.62*dkV;
      headG.rotation.x+=.4*dkV;
      legL.rotation.x*=1-.75*dkV;legR.rotation.x*=1-.75*dkV;
      tail.rotation.y*=1-.6*dkV;tail.rotation.x-=.25*dkV;
    }else if(bodyG.scale.y!==1){bodyG.scale.y=1;headG.position.y=2.8;}
  }
  const sh=1/(1+dino.position.y*.25);
  shadow.position.z=dino.position.z;shadow.position.x=-.5;shadow.scale.set(1.5*sh,2.4*sh,1);shadow.material.opacity=.32*sh;

  // Camera
  camYaw+=((state==='play'&&py>0?.16:0)-camYaw)*Math.min(1,dt*4);
  const cj=Math.abs(camYaw)/.16,ca=Math.cos(camYaw),sa=Math.sin(camYaw),dx=3.2,dz=11;
  cam.position.set(dx*ca+dz*sa,4.6+py*.3+cj*.3,-dx*sa+dz*ca);
  if(shake>0){shake-=dt;cam.position.x+=(Math.random()-.5)*shake*1.5;cam.position.y+=(Math.random()-.5)*shake;}
  cam.lookAt(-.3*(1-cj*.3),1.9+py*.3,-6*(1-cj*.3));
  cam.rotateZ(camYaw*.06);
  punch=Math.max(0,punch-dt*2.5);
  const f=baseFov+cj*2-punch*7;if(Math.abs(cam.fov-f)>.05){cam.fov=f;cam.updateProjectionMatrix();}
  renderer.render(scene,cam);
}
requestAnimationFrame(frame);
})();
</script>
