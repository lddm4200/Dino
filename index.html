<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khủng long 3D</title>
<style>
:root{--sky:#f1ece2;--card:rgba(40,27,52,0.95);--cardfg:#fff;--edge:#b79ddb;--sub:#d9c9ee;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--sky);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS",system-ui,-apple-system,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none}
.card{background:var(--card);color:var(--cardfg);border:2px solid var(--edge);border-radius:12px;padding:6px 14px;text-align:center;min-width:92px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#fl{position:fixed;inset:0;background:#e0452e;opacity:0;pointer-events:none}
.card small{display:block;font-size:11px;color:var(--sub);letter-spacing:.04em}
.card b{font-size:26px;font-variant-numeric:tabular-nums;font-weight:700}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8vh)}
#msg .card{padding:16px 24px;max-width:80%}
#msg h1{margin:0 0 6px;font-size:28px}
#msg p{margin:0;font-size:15px;color:var(--sub)}
#soundBtn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:16px;z-index:100;width:52px;height:52px;border-radius:50%;border:2px solid var(--edge);background:var(--card);color:var(--cardfg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .2s,box-shadow .2s;box-shadow:0 2px 10px rgba(0,0,0,.35);pointer-events:auto;-webkit-tap-highlight-color:transparent}
#soundBtn:hover{transform:scale(1.12);box-shadow:0 4px 16px rgba(0,0,0,.35)}
#soundBtn:active{transform:scale(.95)}
#soundBtn .icon-on{display:inline}
#soundBtn .icon-off{display:none}
#soundBtn.muted .icon-on{display:none}
#soundBtn.muted .icon-off{display:inline}
#soundBtn .slash{position:absolute;width:3px;height:32px;background:#e0452e;border-radius:2px;transform:rotate(45deg);transition:opacity .25s;opacity:0}
#soundBtn.muted .slash{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fl"></div>
<div id="hud">
  <div class="card"><small>Điểm</small><b id="sc">00000</b></div>
  <div class="card"><small>Kỷ lục</small><b id="hi">00000</b></div>
</div>
<div id="msg"><div class="card"><h1 id="t">Khủng long 3D</h1><p id="s">Chạm màn hình để chạy và nhảy qua chướng ngại vật</p></div></div>
<button id="soundBtn" title="Tắt/Bật âm thanh" onclick="event.stopPropagation();toggleSound()"><span class="icon-on">🔊</span><span class="icon-off">🔇</span><div class="slash"></div></button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// === HỆ THỐNG ÂM THANH ===
var audioCtx=null,muted=false,bgmGain=null,sfxGain=null,bgmStarted=false;
function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    bgmGain=audioCtx.createGain();bgmGain.gain.value=0.22;bgmGain.connect(audioCtx.destination);
    sfxGain=audioCtx.createGain();sfxGain.gain.value=0.45;sfxGain.connect(audioCtx.destination);
  }catch(e){audioCtx=null;}
}
var bgmInterval=null,bgmIndex=0;
var bgmMelody=[523.25,587.33,659.25,698.46,783.99,698.46,659.25,587.33,523.25,493.88,440.00,493.88,523.25,587.33,659.25,783.99,698.46,659.25,587.33,523.25,493.88,523.25,587.33,659.25,783.99,880.00,783.99,698.46,659.25,587.33,523.25,493.88,440.00,493.88,523.25,587.33,659.25,783.99,880.00,783.99,698.46,783.99,880.00,1046.50,880.00,783.99,698.46,659.25];
var bgmBass=[261.63,261.63,329.63,329.63,349.23,349.23,293.66,293.66,261.63,261.63,220.00,220.00,261.63,261.63,329.63,329.63,349.23,349.23,293.66,293.66,246.94,246.94,261.63,261.63,392.00,392.00,349.23,349.23,329.63,329.63,261.63,261.63,220.00,220.00,261.63,261.63,329.63,329.63,392.00,392.00,349.23,349.23,440.00,440.00,392.00,392.00,349.23,349.23];
var bgmBeat=0;
function playBgmNote(){
  if(!audioCtx||muted)return;
  var now=audioCtx.currentTime,idx=bgmIndex%bgmMelody.length;
  var osc=audioCtx.createOscillator(),env=audioCtx.createGain();
  osc.type='square';osc.frequency.value=bgmMelody[idx];
  env.gain.setValueAtTime(0.09,now);env.gain.exponentialRampToValueAtTime(0.001,now+0.14);
  osc.connect(env);env.connect(bgmGain);osc.start(now);osc.stop(now+0.15);
  var bass=audioCtx.createOscillator(),bassEnv=audioCtx.createGain();
  bass.type='triangle';bass.frequency.value=bgmBass[idx];
  bassEnv.gain.setValueAtTime(0.07,now);bassEnv.gain.exponentialRampToValueAtTime(0.001,now+0.12);
  bass.connect(bassEnv);bassEnv.connect(bgmGain);bass.start(now);bass.stop(now+0.13);
  bgmBeat++;
  if(bgmBeat%2===0){var hh=audioCtx.createBufferSource(),hhBuf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.03,audioCtx.sampleRate),hhData=hhBuf.getChannelData(0);for(var i=0;i<hhData.length;i++)hhData[i]=(Math.random()*2-1)*Math.pow(1-i/hhData.length,3);hh.buffer=hhBuf;var hhGain=audioCtx.createGain();hhGain.gain.value=0.04;hh.connect(hhGain);hhGain.connect(bgmGain);hh.start(now);}
  if(bgmBeat%4===0){var kick=audioCtx.createOscillator(),kickEnv=audioCtx.createGain();kick.type='sine';kick.frequency.setValueAtTime(120,now);kick.frequency.exponentialRampToValueAtTime(40,now+0.08);kickEnv.gain.setValueAtTime(0.1,now);kickEnv.gain.exponentialRampToValueAtTime(0.001,now+0.1);kick.connect(kickEnv);kickEnv.connect(bgmGain);kick.start(now);kick.stop(now+0.11);}
  bgmIndex++;
}
function startBgm(){if(bgmStarted||muted)return;bgmStarted=true;bgmIndex=0;bgmBeat=0;bgmInterval=setInterval(playBgmNote,150);}
function stopBgm(){if(bgmInterval){clearInterval(bgmInterval);bgmInterval=null;}bgmStarted=false;}
function playJumpSound(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  var osc=audioCtx.createOscillator(),env=audioCtx.createGain();osc.type='sine';
  osc.frequency.setValueAtTime(280,now);osc.frequency.exponentialRampToValueAtTime(880,now+0.12);
  env.gain.setValueAtTime(0.3,now);env.gain.exponentialRampToValueAtTime(0.001,now+0.2);
  osc.connect(env);env.connect(sfxGain);osc.start(now);osc.stop(now+0.22);
  var osc2=audioCtx.createOscillator(),env2=audioCtx.createGain();osc2.type='triangle';
  osc2.frequency.setValueAtTime(450,now);osc2.frequency.exponentialRampToValueAtTime(1100,now+0.09);
  env2.gain.setValueAtTime(0.12,now);env2.gain.exponentialRampToValueAtTime(0.001,now+0.14);
  osc2.connect(env2);env2.connect(sfxGain);osc2.start(now);osc2.stop(now+0.16);
}
function playGameOverSound(){
  if(!audioCtx||muted)return;stopBgm();var now=audioCtx.currentTime;
  var noise=audioCtx.createBufferSource(),buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.35,audioCtx.sampleRate),data=buf.getChannelData(0);
  for(var i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);
  noise.buffer=buf;var nGain=audioCtx.createGain();nGain.gain.setValueAtTime(0.28,now);nGain.gain.exponentialRampToValueAtTime(0.001,now+0.35);
  noise.connect(nGain);nGain.connect(sfxGain);noise.start(now);
  var kick=audioCtx.createOscillator(),kickEnv=audioCtx.createGain();kick.type='sine';
  kick.frequency.setValueAtTime(160,now);kick.frequency.exponentialRampToValueAtTime(25,now+0.25);
  kickEnv.gain.setValueAtTime(0.4,now);kickEnv.gain.exponentialRampToValueAtTime(0.001,now+0.28);
  kick.connect(kickEnv);kickEnv.connect(sfxGain);kick.start(now);kick.stop(now+0.3);
  [523.25,493.88,440,392,349.23,329.63,293.66,261.63,220,196].forEach(function(freq,i){
    var tt=now+0.35+i*0.1,o=audioCtx.createOscillator(),e=audioCtx.createGain();o.type='square';o.frequency.value=freq;
    e.gain.setValueAtTime(0.12,tt);e.gain.exponentialRampToValueAtTime(0.001,tt+0.09);o.connect(e);e.connect(sfxGain);o.start(tt);o.stop(tt+0.1);
  });
}
function playScoreSound(){
  if(!audioCtx||muted)return;var now=audioCtx.currentTime;
  var o1=audioCtx.createOscillator(),e1=audioCtx.createGain();o1.type='sine';
  o1.frequency.setValueAtTime(880,now);o1.frequency.setValueAtTime(1108.73,now+0.06);
  e1.gain.setValueAtTime(0.2,now);e1.gain.exponentialRampToValueAtTime(0.001,now+0.15);
  o1.connect(e1);e1.connect(sfxGain);o1.start(now);o1.stop(now+0.17);
  var o2=audioCtx.createOscillator(),e2=audioCtx.createGain();o2.type='sine';o2.frequency.value=1318.51;
  e2.gain.setValueAtTime(0,now);e2.gain.setValueAtTime(0.15,now+0.08);e2.gain.exponentialRampToValueAtTime(0.001,now+0.2);
  o2.connect(e2);e2.connect(sfxGain);o2.start(now);o2.stop(now+0.22);
}
function toggleSound(){
  initAudio();muted=!muted;var btn=document.getElementById('soundBtn');
  if(muted){btn.classList.add('muted');btn.title='Bật âm thanh';stopBgm();if(bgmGain)bgmGain.gain.value=0;if(sfxGain)sfxGain.gain.value=0;}
  else{btn.classList.remove('muted');btn.title='Tắt âm thanh';if(bgmGain)bgmGain.gain.value=0.22;if(sfxGain)sfxGain.gain.value=0.45;}
}
</script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){$('t').textContent='Không tải được thư viện 3D';return;}
const pad=n=>String(n).padStart(5,'0');

// === NHẬN DIỆN THIẾT BỊ VÀ TỐI ƯU HÓA CHO ĐIỆN THOẠI YẾU ===
const isMobile=/Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)||(window.innerWidth<800);
const renderer=new THREE.WebGLRenderer({
  canvas:$('c'),
  antialias:!isMobile, // Tắt khử răng cưa nặng trên điện thoại để tiết kiệm 70% tải GPU
  powerPreference:'high-performance',
  precision:isMobile?'mediump':'highp',
  stencil:false
});
// Khóa DPR ở 1.0 trên mobile yếu để triệt tiêu tình trạng quá tải render
const maxDpr=isMobile?1.0:1.5;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,maxDpr));

// === CHU KỲ NGÀY ĐÊM (chậm rãi, tự nhiên) ===
const DAY_CYCLE=2000;
const timePhases={
  day:    {sky:0x7ec0ee, fog:0xc2e2f5, ground:0x8FBC6B, lane:0xB8A87A, sunI:0.9,  hemiI:1.0,  sunC:0xFFF4E0, mountainC:0x6B9E68},
  sunset: {sky:0xFF7A45, fog:0xFFA278, ground:0xB89058, lane:0x9E7E56, sunI:0.8,  hemiI:0.85, sunC:0xFFA658, mountainC:0x9E6845},
  night:  {sky:0x1A2844, fog:0x253654, ground:0x34524E, lane:0x4E6278, sunI:0.55, hemiI:0.72, sunC:0xB2D0FF, mountainC:0x2C405E},
  dawn:   {sky:0xE898B0, fog:0xF0BCC8, ground:0x85AB6C, lane:0xA89270, sunI:0.75, hemiI:0.85, sunC:0xFFCC99, mountainC:0x7A8065}
};

const todResult={phase:'day',blend:0,next:'day'};
function getTimeOfDay(score){
  const pos=(score%DAY_CYCLE)/DAY_CYCLE;
  if(pos<0.4){todResult.phase='day';todResult.blend=0;todResult.next='day';}
  else if(pos<0.45){todResult.phase='day';todResult.blend=(pos-0.4)/0.05;todResult.next='sunset';}
  else if(pos<0.55){todResult.phase='sunset';todResult.blend=0;todResult.next='sunset';}
  else if(pos<0.6){todResult.phase='sunset';todResult.blend=(pos-0.55)/0.05;todResult.next='night';}
  else if(pos<0.8){todResult.phase='night';todResult.blend=0;todResult.next='night';}
  else if(pos<0.85){todResult.phase='night';todResult.blend=(pos-0.8)/0.05;todResult.next='dawn';}
  else if(pos<0.95){todResult.phase='dawn';todResult.blend=0;todResult.next='dawn';}
  else{todResult.phase='dawn';todResult.blend=(pos-0.95)/0.05;todResult.next='day';}
  return todResult;
}

function lerpColor(c1,c2,t){
  const r1=(c1>>16)&0xFF,g1=(c1>>8)&0xFF,b1=c1&0xFF;
  const r2=(c2>>16)&0xFF,g2=(c2>>8)&0xFF,b2=c2&0xFF;
  return((r1+(r2-r1)*t)<<16)|((g1+(g2-g1)*t)<<8)|(b1+(b2-b1)*t);
}
function lerpVal(a,b,t){return a+(b-a)*t;}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x7ec0ee);
scene.fog=new THREE.Fog(0xc2e2f5,30,130);
const cam=new THREE.PerspectiveCamera(58,1,0.1,300);

const hemiLight=new THREE.HemisphereLight(0xffffff,0x8FBC6B,1.0);
scene.add(hemiLight);
const sun=new THREE.DirectionalLight(0xfff4e0,0.9);sun.position.set(6,12,5);scene.add(sun);
const moonLight=new THREE.DirectionalLight(0x98C0FF,0);moonLight.position.set(-5,10,-3);scene.add(moonLight);

const mats={},geos={};
const M=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c,flatShading:true}));
const G=(w,h,d)=>geos[w+','+h+','+d]||(geos[w+','+h+','+d]=new THREE.BoxGeometry(w,h,d));
const bx=(w,h,d,c,x,y,z,p)=>{const m=new THREE.Mesh(G(w,h,d),M(c));m.position.set(x,y,z);p.add(m);return m;};
const rockGeo=new THREE.DodecahedronGeometry(1,0);

// === BỘ GEOMETRIES TÁI SỬ DỤNG TRÁNH LEAK RAM TRÊN MOBILE YẾU ===
const eggGeo=new THREE.SphereGeometry(0.3,6,4);
const bushGeo1=new THREE.DodecahedronGeometry(0.8,0);
const bushGeo2=new THREE.DodecahedronGeometry(0.6,0);
const bushSmallGeo=new THREE.DodecahedronGeometry(0.35,0);
const flowerGeo=new THREE.SphereGeometry(0.12,5,4);

// === MẶT ĐẤT CẢI TIẾN ===
const groundMat=new THREE.MeshLambertMaterial({color:0x8FBC6B,flatShading:true});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),groundMat);
ground.rotation.x=-Math.PI/2;ground.position.z=-120;scene.add(ground);

// Đường chạy với viền
const laneMat=new THREE.MeshLambertMaterial({color:0xB8A87A,flatShading:true});
const lane=new THREE.Mesh(new THREE.PlaneGeometry(8,400),laneMat);
lane.rotation.x=-Math.PI/2;lane.position.set(0,0.01,-120);scene.add(lane);

// Viền đường (2 sọc trắng)
const edgeMat=new THREE.MeshLambertMaterial({color:0xE8DCC0,flatShading:true});
const edgeL=new THREE.Mesh(new THREE.PlaneGeometry(0.3,400),edgeMat);
edgeL.rotation.x=-Math.PI/2;edgeL.position.set(-4.15,0.02,-120);scene.add(edgeL);
const edgeR=new THREE.Mesh(new THREE.PlaneGeometry(0.3,400),edgeMat);
edgeR.rotation.x=-Math.PI/2;edgeR.position.set(4.15,0.02,-120);scene.add(edgeR);

// Vạch giữa đường (dash - tối ưu số lượng)
const dashMat=new THREE.MeshLambertMaterial({color:0xD0C098,flatShading:true});
const dashes=[];
const dashCount=isMobile?10:18;
const dashSpacing=12;
for(let i=0;i<dashCount;i++){
  const d=new THREE.Mesh(new THREE.PlaneGeometry(0.25,3.5),dashMat);
  d.rotation.x=-Math.PI/2;d.position.set(0,0.02,-i*dashSpacing);scene.add(d);dashes.push(d);
}

// Núi xa (dùng chung 1 material để giảm draw call)
const mountainMat=new THREE.MeshLambertMaterial({color:0x6B9E68,flatShading:true});
const mountains=[];
[[-70,-115,55,16],[-20,-120,40,22],[30,-118,50,12],[80,-112,45,20],[-50,-125,60,18],[60,-122,35,14]].forEach(([x,z,w,h])=>{
  const mt=new THREE.Mesh(G(w,h,12),mountainMat);
  mt.position.set(x,h/2,z);scene.add(mt);
  mountains.push(mt);
});
// Đỉnh núi tuyết
[[-20,-120,15,4,20],[80,-112,12,3,18],[-50,-125,18,3.5,16.5]].forEach(([x,z,w,h,baseH])=>{
  bx(w,h,8,0xE8E8E0,x,baseH+h/2,z,scene);
});

// === MÂY TRÔI (nhẹ, dùng chung geometry và material) ===
const clouds=[];
const cloudGeo=new THREE.DodecahedronGeometry(1.5,0);
const cloudMat=new THREE.MeshLambertMaterial({color:0xFFFFFF,transparent:true,opacity:0.85});
const cloudCount=isMobile?5:8;
for(let i=0;i<cloudCount;i++){
  const g=new THREE.Group();
  const n=isMobile?2:3;
  for(let j=0;j<n;j++){
    const s=1.3+Math.random()*1.5;
    const cg=new THREE.Mesh(cloudGeo,cloudMat);
    cg.position.set((j-(n-1)/2)*2.2+(Math.random()-0.5)*0.8,(Math.random()-0.5)*0.5,(Math.random()-0.5)*1.2);
    cg.scale.set(s,s*0.45,s*0.8);
    g.add(cg);
  }
  g.position.set(-80+Math.random()*160,25+Math.random()*18,-60-Math.random()*70);
  g.userData.speed=0.25+Math.random()*0.35;
  scene.add(g);clouds.push(g);
}

// === SAO ĐÊM ===
const starsGeo=new THREE.BufferGeometry();
const starPositions=[];
const starCount=isMobile?70:150;
for(let i=0;i<starCount;i++){
  starPositions.push((Math.random()-0.5)*320,25+Math.random()*60,-60-Math.random()*80);
}
starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));
const starsMat=new THREE.PointsMaterial({color:0xFFFFFF,size:isMobile?0.45:0.3,transparent:true,opacity:0});
const stars=new THREE.Points(starsGeo,starsMat);
scene.add(stars);

// === MẶT TRỜI / MẶT TRĂNG 3D (nằm phía sau rặng núi ở z = -190) ===
const sunSphere=new THREE.Mesh(
  new THREE.SphereGeometry(7,10,8),
  new THREE.MeshBasicMaterial({color:0xFFEE55,fog:false})
);
const sunGlow=new THREE.Mesh(
  new THREE.SphereGeometry(12,10,8),
  new THREE.MeshBasicMaterial({color:0xFFAA22,transparent:true,opacity:0.22,fog:false})
);
sunSphere.add(sunGlow);
sunSphere.position.set(0,80,-190);
scene.add(sunSphere);

const moonSphere=new THREE.Mesh(
  new THREE.SphereGeometry(5.5,10,8),
  new THREE.MeshBasicMaterial({color:0xEEF3FF,fog:false})
);
const moonGlow=new THREE.Mesh(
  new THREE.SphereGeometry(9.5,10,8),
  new THREE.MeshBasicMaterial({color:0x99BBFF,transparent:true,opacity:0.2,fog:false})
);
moonSphere.add(moonGlow);
moonSphere.position.set(0,-50,-190);
moonSphere.visible=false;
scene.add(moonSphere);

// Xương rồng (cactus)
function cactus(h,arms){
  const g=new THREE.Group(),c=0x5f8f4e;
  bx(.8,h,.8,c,0,h/2,0,g);
  if(arms){
    bx(.9,.5,.5,c,-.7,h*.55,0,g);bx(.5,h*.3,.5,c,-1,h*.55+h*.15,0,g);
    bx(.9,.5,.5,c,.7,h*.4,0,g);bx(.5,h*.3,.5,c,1,h*.4+h*.15,0,g);
  }
  return g;
}

// === VẬT CẢN (TỐI ƯU HÓA HÌNH KHỐI) ===

// 1. Xương khủng long
function fossil(){
  const g=new THREE.Group(),bc=0xE8D8C0,dc=0xD0BFA0;
  bx(3,.4,.4,bc,0,.5,0,g);
  for(let i=-1;i<=1;i++){
    bx(.15,1.2,.15,bc,i*.8,1.1,0,g);
    bx(.15,.15,.6,dc,i*.8,1.7,.2,g);
  }
  bx(.8,.7,.7,bc,-1.8,.7,0,g);
  bx(.4,.3,.5,dc,-2.2,.6,0,g);
  bx(.15,.15,.15,0x333333,-2.3,.8,.2,g);
  return g;
}

// 2. Khúc gỗ
function log(){
  const g=new THREE.Group(),lc=0x8B6914,dc=0x6B4E0A;
  bx(3,.8,.8,lc,0,.4,0,g);
  bx(3.1,.3,.3,dc,0,.55,0,g);
  bx(.4,.5,.4,dc,-.8,.7,.3,g);

// === TRẠNG THÁI GAME ===
let state='ready',t=0,runT=0,dist=0,score=0,lastScoreColor=-1,speed=20,py=0,vy=0,jumpBuf=0,gap=40,overT=0,hi=0,shake=0,last=performance.now(),camYaw=0,jumpDir=1,air=0,land=0,baseFov=58,punch=0,dvy=0,dvz=0,hitObs=null;
try{hi=+localStorage.getItem('dino3d_hi')||0;}catch(e){}
$('hi').textContent=pad(hi);
const JUMP=23,GRAV=52,msg=$('msg');

function reset(){
  for(let i=0;i<obs.length;i++)scene.remove(obs[i].g);
  obs.length=0;
  dist=0;score=0;lastScoreColor=-1;speed=20;py=0;vy=0;gap=40;jumpBuf=0;
  dino.rotation.set(0,0,0);dino.position.set(0,0,0);dino.scale.set(1,1,1);hitObs=null;
  for(let i=0;i<parts.length;i++){parts[i].life=0;parts[i].m.visible=false;}
  $('sc').textContent=pad(0);msg.style.display='none';state='play';
  startBgm();
}
function die(o){
  playGameOverSound();
  state='over';overT=0;shake=.7;punch=1;hitObs=o||null;dvy=10;dvz=9;
  burst(o?o.g.position.x:0,1.6,o?o.g.position.z:-1.5);
  const fl=$('fl');fl.style.transition='none';fl.style.opacity='.5';void fl.offsetWidth;fl.style.transition='opacity .6s';fl.style.opacity='0';
  if(score>hi){hi=score;$('hi').textContent=pad(hi);try{localStorage.setItem('dino3d_hi',hi);}catch(e){}}
  $('t').textContent='Game over';
  $('s').textContent='Điểm '+score+'. Chạm để chơi lại';
  setTimeout(()=>{if(state==='over')msg.style.display='flex';},700);
}
function act(){
  initAudio();
  if(state==='ready'){state='play';msg.style.display='none';startBgm();}
  else if(state==='over'){if(overT>.5)reset();else return;}
  jumpBuf=.14;
}
addEventListener('pointerdown',e=>{e.preventDefault();act();},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'){e.preventDefault();if(!e.repeat)act();}});

function resize(){
  const w=innerWidth,h=innerHeight,a=w/h;
  const dpr=isMobile?1.0:1.5;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,dpr));
  renderer.setSize(w,h,false);

}
addEventListener('resize',resize);resize();

// === VÒNG LẶP CHÍNH (ĐƯỢC TỐI ƯU HÓA CAO CHO ĐIỆN THOẠI YẾU) ===
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.035);last=now;t+=dt;
  let mv=0;

  if(state==='play'){
    const prevScore=score;
    score=Math.floor(dist*.4);
    if(Math.floor(score/100)>Math.floor(prevScore/100)) playScoreSound();
    speed=20+Math.min(28,score*.02);
    mv=speed*dt;dist+=mv;
    gap-=mv;if(gap<=0){spawn();gap=speed*(1.1+Math.random())+6;}
    if(jumpBuf>0){jumpBuf-=dt;if(py<=0){vy=JUMP;py=.01;jumpBuf=0;jumpDir=-jumpDir;playJumpSound();}}
    if(py>0){vy-=GRAV*dt;py+=vy*dt;if(py<=0){py=0;vy=0;land=.18;shake=Math.max(shake,.07);}}
    for(let i=0;i<obs.length;i++){
      const o=obs[i];
      o.g.position.z+=mv;
      const z=o.g.position.z;
      const baseY=o.g.userData.flying?o.g.position.y:0;
      if(z+o.d/2>-1.5&&z-o.d/2<1&&Math.abs(o.g.position.x)<o.w*.35+.5&&py<(baseY+o.h)*.85&&py+3.5>baseY){die(o);break;}
    }
    for(let i=obs.length-1;i>=0;i--)if(obs[i].g.position.z>12){scene.remove(obs[i].g);obs.splice(i,1);}
    $('sc').textContent=pad(score);
  }

  // === CẬP NHẬT CHU KỲ NGÀY ĐÊM (CHỈ CHẠY KHI ĐIỂM SỐ THAY ĐỔI) ===
  const tod=getTimeOfDay(score);
  const bl=tod.blend;
  const isNight=(tod.phase==='night'||(tod.phase==='sunset'&&bl>0.5))?1:0;

  if(score!==lastScoreColor){
    lastScoreColor=score;
    const phA=timePhases[tod.phase],phB=timePhases[tod.next];
    const curSky=lerpColor(phA.sky,phB.sky,bl);
    const curFog=lerpColor(phA.fog,phB.fog,bl);
    const curGround=lerpColor(phA.ground,phB.ground,bl);
    const curLane=lerpColor(phA.lane,phB.lane,bl);
    const curSunC=lerpColor(phA.sunC,phB.sunC,bl);
    const curSunI=lerpVal(phA.sunI,phB.sunI,bl);
    const curHemiI=lerpVal(phA.hemiI,phB.hemiI,bl);
    const curMountain=lerpColor(phA.mountainC,phB.mountainC,bl);

    scene.background.setHex(curSky);
    scene.fog.color.setHex(curFog);
    groundMat.color.setHex(curGround);
    laneMat.color.setHex(curLane);
    mountainMat.color.setHex(curMountain);
    sun.color.setHex(curSunC);
    sun.intensity=curSunI;
    hemiLight.intensity=curHemiI;
    hemiLight.groundColor.setHex(curGround);

    edgeMat.color.setHex(isNight?0xDCE8FF:0xE8DCC0);
    dashMat.color.setHex(isNight?0x88A6C5:0xD0C098);
    cloudMat.opacity=0.85*(tod.phase==='night'?0.45:tod.phase==='sunset'?0.7:1.0);
  }

  // Vị trí mặt trời / mặt trăng
  const dayPos=(score%DAY_CYCLE)/DAY_CYCLE;
  const theta=(dayPos-0.2)*Math.PI*2;
  const sunX=Math.sin(theta)*115;
  const sunY=Math.cos(theta)*70+10;
  sunSphere.position.set(sunX,sunY,-190);
  sunSphere.visible=(sunY>2);
  sunSphere.material.color.setHex((dayPos>=0.38&&dayPos<0.58)?0xFF7722:(dayPos>=0.88)?0xFFAA44:0xFFEE55);

  const moonTheta=theta+Math.PI;
  const moonX=Math.sin(moonTheta)*110;
  const moonY=Math.cos(moonTheta)*65+10;
  moonSphere.position.set(moonX,moonY,-190);
  moonSphere.visible=(moonY>2);

  // Ánh sáng theo chu kỳ
  moonLight.intensity=lerpVal(moonLight.intensity,isNight?0.45:0,Math.min(1,dt*2));
  sun.position.set(sunX*0.15,Math.max(10,sunY*0.2),20);
  moonLight.position.set(moonX*0.15,Math.max(8,moonY*0.2),15);

  // Sao đêm
  const starTarget=(tod.phase==='night')?0.9:(tod.phase==='sunset'&&bl>0.6)?0.4:(tod.phase==='dawn'&&bl<0.4)?0.3:0;
  starsMat.opacity+=(starTarget-starsMat.opacity)*Math.min(1,dt*2);

  if(state==='over')overT+=dt;
  const ts=state==='over'?(overT<.08?0:Math.min(1,.25+(overT-.08)*1.2)):1,sd=dt*ts;

  if(mv>0){
    for(let i=0;i<decor.length;i++){
      decor[i].position.z+=mv;
      if(decor[i].position.z>12)placeDecor(decor[i],true);
    }
    for(let i=0;i<ripples.length;i++){
      ripples[i].position.z+=mv;
      if(ripples[i].position.z>10){ripples[i].position.z=-110;ripples[i].position.x=(Math.random()-.5)*8;}
    }
    const dashLoop=dashCount*dashSpacing;
    for(let i=0;i<dashes.length;i++){
      dashes[i].position.z+=mv;
      if(dashes[i].position.z>10)dashes[i].position.z-=dashLoop;
    }
  }

  // Mây trôi
  for(let i=0;i<clouds.length;i++){
    clouds[i].position.x+=clouds[i].userData.speed*dt;
    if(clouds[i].position.x>100)clouds[i].position.x=-100;
  }

  // Cánh thằn lằn bay
  for(let i=0;i<obs.length;i++){
    const o=obs[i];
    if(o.g.userData.flying){
      const wt=t*8;
      if(o.g.userData.wingL){
        o.g.userData.wingL.rotation.z=Math.sin(wt)*0.4;
        o.g.userData.wingR.rotation.z=-Math.sin(wt)*0.4;
      }
      o.g.position.y=2+Math.sin(t*3)*0.5;
    }
  }

  for(let i=0;i<parts.length;i++){
    const p=parts[i];
    if(p.life<=0)continue;
    p.life-=sd;p.vy-=30*sd;
    const q=p.m.position;q.x+=p.vx*sd;q.y+=p.vy*sd;q.z+=p.vz*sd;
    if(q.y<.15){q.y=.15;p.vy*=-.3;p.vx*=.7;p.vz*=.7;}
    p.m.rotation.x+=sd*8;p.m.rotation.z+=sd*6;
    p.m.scale.setScalar(Math.max(.001,Math.min(1,p.life/.4)*p.s));
    if(p.life<=0)p.m.visible=false;
  }

  // Hoạt ảnh khủng long
  if(state==='over'){
    dvy-=40*sd;dino.position.y+=dvy*sd;dino.position.z+=dvz*sd;
    if(dvy<0&&dino.position.y<FL){dino.position.y=FL;dvy=dvy<-4?-dvy*.3:0;dvz*=.55;}
    if(dino.position.y===FL&&dvy===0)dvz*=Math.pow(.02,sd);
    dino.rotation.x+=(1.45-dino.rotation.x)*Math.min(1,sd*5);
    dino.rotation.z+=(.35-dino.rotation.z)*Math.min(1,sd*4);
    const fl=Math.max(0,1-overT*1.5);
    legL.rotation.x=Math.sin(overT*22)*.9*fl-.3;legR.rotation.x=Math.sin(overT*22+2)*.9*fl-.3;
    armL.rotation.x=armR.rotation.x=1.2*fl+.2;
    headG.rotation.x=.3;
    dino.scale.set(1,1,1);
    if(hitObs)hitObs.g.rotation.x+=(-1.3-hitObs.g.rotation.x)*Math.min(1,sd*5);
  }else{
    runT+=dt*(state==='play'?9+speed*.25:0);
    air+=((py>0?1:0)-air)*Math.min(1,dt*14);
    land=Math.max(0,land-dt);
    const sq=land/.18,st=py>0?.08*Math.min(1,Math.abs(vy)/JUMP):0;
    dino.scale.set(1+.1*sq-st*.5,1-.15*sq+st,1+.1*sq-st*.5);
    dino.position.y=py;
    dino.rotation.x=Math.max(-.3,Math.min(.3,vy*.012));
    const s=Math.sin(runT),k=1-air,L=(a,b)=>a+(b-a)*air;
    legL.rotation.x=L(s*.9,-.9);legR.rotation.x=L(-s*.9,.6);
    armL.rotation.x=L(-s*.9,1);armR.rotation.x=L(s*.9,1);
    headG.rotation.x=L(Math.sin(runT*2)*.07,.28);
    bodyG.position.y=state==='play'&&py<=0?Math.abs(s)*.14:Math.sin(t*3)*.04;
    bodyG.rotation.z=s*.06*k;bodyG.rotation.y=s*.05*k;
    tail.rotation.y=Math.sin(runT*.8+(state==='ready'?t*2:0))*.4*k;
    tail.rotation.x=L(Math.sin(runT*2)*.06,-.35);
  }
  const sh=1/(1+dino.position.y*.25);
  shadow.position.z=dino.position.z;shadow.position.x=-.5;shadow.scale.set(1.5*sh,2.4*sh,1);shadow.material.opacity=.32*sh;

  // Camera
  camYaw+=((state==='play'&&py>0?.16:0)-camYaw)*Math.min(1,dt*4);
  const cj=Math.abs(camYaw)/.16,ca=Math.cos(camYaw),sa=Math.sin(camYaw),dx=3.2,dz=11;
  cam.position.set(dx*ca+dz*sa,4.6+py*.3+cj*.3,-dx*sa+dz*ca);
  if(shake>0){shake-=dt;cam.position.x+=(Math.random()-.5)*shake*1.5;cam.position.y+=(Math.random()-.5)*shake;}
  cam.lookAt(-.3*(1-cj*.3),1.9+py*.3,-6*(1-cj*.3));
  cam.rotateZ(camYaw*.06);
  punch=Math.max(0,punch-dt*2.5);
  const f=baseFov+cj*2-punch*7;if(Math.abs(cam.fov-f)>.05){cam.fov=f;cam.updateProjectionMatrix();}
  renderer.render(scene,cam);
}
requestAnimationFrame(frame);
})();
