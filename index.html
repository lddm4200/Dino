<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khủng long 3D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="spaceVignette"></div>
<div id="fl"></div>
<div id="warpFlash"></div>
<div id="spaceBanner">
  <div class="banner-title">TIẾN VÀO KHÔNG GIAN THIÊN HÀ!</div>
  <div class="banner-sub">Khủng long đã cất cánh — né các chướng ngại vật vũ trụ!</div>
</div>
<div id="hud">
  <div class="card" id="scoreCard" title="Nhấp để thử nghiệm mốc 10.000 điểm"><small>Điểm</small><b id="sc">00000</b></div>
  <div class="card"><small>Kỷ lục</small><b id="hi">00000</b></div>
</div>
<div id="msg"><div class="card"><h1 id="t">Khủng long 3D</h1><p id="s">Chạm màn hình để chạy và nhảy qua chướng ngại vật</p></div></div>
<button id="soundBtn" title="Tắt/Bật âm thanh"><span class="icon-on">🔊</span><span class="icon-off">🔇</span><div class="slash"></div></button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
